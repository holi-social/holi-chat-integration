cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules
    - .yarn/

default:
  tags:
    - 1cpu-4gb

stages:
  - 'install_dependencies'
  - 'test'
  - 'build'
  - 'deploy'

install_dependencies:
  stage: install_dependencies
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:18.20.4'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules
      - .yarn/
  script:
    - yarn install --immutable --check-cache
  only:
    changes:
      - yarn.lock

test:
  stage: 'test'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules
      - .yarn/
    policy: pull
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:18.20.4'
  script:
    - yarn test

build:
  stage: 'build'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules
      - .yarn/
    policy: pull
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/node:18.20.4'
  script:
    - yarn build
  artifacts:
    paths:
      - dist/

.deploy:
  stage: 'deploy'
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.9.8'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  artifacts:
    paths:
      - 'terraform/environments/crash.log' # optional, only available in case of a crash/panic
      - 'terraform/environments/terraform-*.log' # separate log for every step/command
      - $API_BASE_URL_PATH
    name: '${CI_JOB_NAME}_${CI_JOB_ID}'
    #when: on_failure # can't do that for api base url, but can't define multiple artifacts
    expire_in: 1 week
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  script:
    - apk add zip
    - zip -r receiveEvent.zip dist package.json yarn.lock .yarn/ .yarnrc*
    - terraform/environments/scripts/create-or-update-env.sh "$ENVIRONMENT_ID" "$CI_COMMIT_SHA"

staging_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: 'staging'
  only:
    - main

production_deploy:
  extends: .deploy
  variables:
    ENVIRONMENT_ID: 'production'
  only:
    - production
